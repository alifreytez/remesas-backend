services:
    api:
        build:
            context: .
            dockerfile: Dockerfile
            target: ${APP_ENV:-development}
        container_name: REMESAS-api
        restart: always
        volumes:
            - ./src:/app/src
            - ./.sequelizerc:/app/.sequelizerc:ro
        expose:
            - '4000'
        ports:
            - '4000:4000'
        depends_on:
            - db
            - redis
        env_file:
            - .env
        environment:
            - NODE_OPTIONS=--dns-result-order=ipv4first --max-old-space-size=4096
            - RUNNING_IN_DOCKER=true
            - IS_DOCKER=true
            - DB_POSTGRESQL_MAIN_HOST=db
            - DB_POSTGRESQL_MAIN_PORT=5432
            - CACHE_DATABASE_HOST=redis
            - CACHE_DATABASE_PORT=6379
            - NPM_CONFIG_UPDATE_NOTIFIER=false
        networks:
            - REMESAS-network

    nginx:
        build:
            context: ./docker/nginx
            dockerfile: Dockerfile
        container_name: REMESAS-nginx
        restart: always
        depends_on:
            - api
        networks:
            - REMESAS-network
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./docker/nginx/default.local.conf:/etc/nginx/conf.d/default.conf:ro
            - nginx_certs:/etc/nginx/certs

    db:
        image: postgres:15-alpine
        container_name: REMESAS-main-db
        restart: always
        environment:
            - POSTGRES_USER=${DB_POSTGRESQL_MAIN_USERNAME}
            - POSTGRES_PASSWORD=${DB_POSTGRESQL_MAIN_PASSWORD}
            - POSTGRES_DB=${DB_POSTGRESQL_MAIN_DATABASE}
        env_file:
            - .env
        volumes:
            - pgdata:/var/lib/postgresql/data
        ports:
            - '${DB_POSTGRESQL_MAIN_PORT}:5432'
        networks:
            - REMESAS-network

    redis:
        image: redis:alpine
        container_name: REMESAS-redis
        restart: always
        ports:
            - '6379:6379'
        networks:
            - REMESAS-network

    redis-insight:
        image: redis/redisinsight:latest
        container_name: redisinsight
        ports:
            - "5540:5540"
        networks:
            - REMESAS-network

volumes:
    pgdata:
    nginx_certs:

networks:
    REMESAS-network:
        driver: bridge

